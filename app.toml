[app]
name = "CABench"
slug = "cabench"
bundle_id = "com.fathforce.cabench"
version = "0.1.0"
accent_color = "orange"
error_prefix = "BENCH"
description = "All-in-one hardware benchmarking and security pen-testing suite for CA ecosystem"

[window]
title = "CABench"
width = 1280
height = 850
min_width = 900
min_height = 650

[security]
master_password_required = false
profile_pin_enabled = false

[modules]
sample_slice_enabled = false
ai_assistant_enabled = true
pro_licensing_enabled = true
updater_enabled = true
crash_reporting_enabled = true
backup_restore_enabled = true

[roles]
default_role = "member"
allowed_roles = ["owner", "partner", "member", "child"]

[[menus]]
key = "dashboard"
label = "Dashboard"
href = "/dashboard"
icon = "dashboard"
description = "System overview, benchmark quick-actions and recent scores"

[[menus]]
key = "cpu"
label = "CPU"
href = "/cpu"
icon = "monitoring"
description = "CPU compute benchmark suite (arithmetic, float, crypto, integer)"

[[menus]]
key = "memory"
label = "Memory"
href = "/memory"
icon = "analytics"
description = "RAM bandwidth and latency stress test"

[[menus]]
key = "gpu"
label = "GPU / 3D"
href = "/gpu"
icon = "analytics"
description = "WGPU / WebGPU 3D render benchmark"

[[menus]]
key = "disk"
label = "Disk"
href = "/disk"
icon = "folder"
description = "NVMe/SSD/HDD sequential and random I/O benchmark"

[[menus]]
key = "network"
label = "Network"
href = "/network"
icon = "globe"
description = "Throughput and latency measurements"

[[menus]]
key = "security"
label = "Security"
href = "/security"
icon = "shield"
description = "Web app security pen-testing: SQLi, XSS, Brute Force, Rate Limit, Fuzz"

[[menus]]
key = "reports"
label = "Reports"
href = "/reports"
icon = "cards"
description = "Benchmark result certificates and comparison reports"

[billing]
enabled = true
product_code = "CABENCH"
gcc_base_url = "https://gcc.fathforce.com"
offline_days = 7
refresh_hours = 6
currencies = ["USD"]

[[billing.public_keys]]
kid = "gcc-2026-10"
ed25519 = "Su0nese5LuWHeNPFIz69p0HGUsdT49rnEn82fbtY2S8="
